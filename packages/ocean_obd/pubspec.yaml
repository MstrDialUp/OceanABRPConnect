name: ocean_obd
description: "Read-only access to a Fisker Ocean's diagnostic bus through an ELM327 BLE adapter: transport with a command allow-list, ELM327, ISO-TP, UDS 0x22, the signal table, and the shared connect and settings screens."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.13
  flutter_foreground_task: ^11.0.3
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/signals/
